<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitcoin Core Benchmarks</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="style.css?v=__ASSET_VERSION__">
</head>
<body>
  <header>
    <div class="header-inner">
      <div>
        <h1>Bitcoin Core Benchmarks</h1>
        <div class="meta" id="updated"></div>
      </div>
      <div class="meta" id="run-count"></div>
    </div>
  </header>
  <main>
    <section class="overview-grid">
      <div class="panel">
        <h2>Largest Changes</h2>
        <div class="note" id="overview-note"></div>
        <div class="trend-grid">
          <button class="trend-card" id="trend-down" type="button">
            <div class="trend-label">Biggest Speedup</div>
            <div class="trend-name">n/a</div>
            <div class="trend-value delta-good">n/a</div>
            <div class="trend-detail"></div>
          </button>
          <button class="trend-card" id="trend-up" type="button">
            <div class="trend-label">Biggest Slowdown</div>
            <div class="trend-name">n/a</div>
            <div class="trend-value delta-bad">n/a</div>
            <div class="trend-detail"></div>
          </button>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Benchmark</th>
                <th>Latest</th>
                <th>Prev</th>
                <th>Delta</th>
                <th>Trend</th>
              </tr>
            </thead>
            <tbody id="overview-body"></tbody>
          </table>
        </div>
      </div>
    </section>

    <div class="toolbar">
      <label>
        Benchmark
        <select id="benchmark"></select>
      </label>
      <label>
        Search
        <input id="benchmark-filter" type="search" placeholder="">
      </label>
      <label>
        Chart view
        <select id="chart-view">
          <option value="movers" selected>Movers</option>
          <option value="all">All series</option>
        </select>
      </label>
      <label>
        Mover range
        <select id="mover-range">
          <option value="recent" selected>Recent</option>
          <option value="all-time">All-time</option>
        </select>
      </label>
      <label>
        Mover direction
        <select id="mover-direction">
          <option value="both" selected>Both</option>
          <option value="slowdowns">Slowdowns</option>
          <option value="speedups">Speedups</option>
        </select>
      </label>
      <label>
        Mover count
        <input id="mover-count" type="number" min="1" max="100" value="20">
      </label>
      <label>
        Recent runs
        <select id="limit">
          <option value="30" selected>30</option>
          <option value="90">90</option>
          <option value="180">180</option>
          <option value="365">365</option>
          <option value="0">All</option>
        </select>
      </label>
      <label>
        Y axis
        <select id="axis-scale">
          <option value="linear">Linear</option>
          <option value="logarithmic" selected>Log</option>
        </select>
      </label>
    </div>
    <div class="chart-selection" id="chart-selection"></div>
    <div class="chart-shell">
      <div id="chart"><canvas id="chart-canvas"></canvas></div>
      <div class="series-panel" id="series-panel"></div>
    </div>
    <div class="summary" id="summary"></div>

    <section class="heatmap-section">
      <h2>Run Heatmap</h2>
      <div class="note" id="heatmap-note"></div>
      <div id="heatmap"></div>
    </section>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="app.js?v=__ASSET_VERSION__"></script>
</body>
</html>
